[plugin]
id = "neko_daily_chronicle"
name = "对话编年史"
description = "把每天的对话完整留存：按日期编成小说式章节，并为每个章节另外写一篇日记。原始记录只追加不覆盖，章节与日记可随时重算。"
short_description = "Keep every day's conversation as a novel-style chapter plus a diary entry."
keywords = [
    "对话",
    "记录",
    "章节",
    "日记",
    "猫娘日记",
    "爱妻日记",
    "备忘录",
    "回忆",
    "编年史",
    "chronicle",
    "diary",
    "chapter",
    "conversation",
    "log",
    "日記",
    "일기",
]
version = "0.2.0"
type = "plugin"
entry = "plugin.plugins.neko_daily_chronicle:NekoDailyChroniclePlugin"

[plugin.author]
name = "随遇"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "对话编年史"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

# 静态浏览页：地址是 /plugin/neko_daily_chronicle/ui/ ，插件管理器里会出现「打开界面」
[[plugin.ui.panel]]
id = "browser"
title = "对话编年史 · 浏览"
entry = "static/index.html"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/quickstart.md"
permissions = ["state:read"]

[plugin_runtime]
enabled = true
auto_start = true
# 留出余量：插件自身 startup 只占 1 秒左右，但开机收尾若被后台模型请求挤住会变慢
timeout = 60

# ─────────────────────────────────────────────────────────────────────
# 业务配置。首次运行时宿主会把 config.example.toml 复制到用户数据目录，
# 之后以用户配置为准；这里写的是"出厂默认值"。
# ─────────────────────────────────────────────────────────────────────
[chronicle]
# 存档布局（相对插件 data 目录）
raw_dir = "raw"
chapters_dir = "chapters"
diary_dir = "diary"
capsule_dir = "capsules"
# 放映厅：每天保存看到第几条、停靠点与手记；关闭时不启动任何后台任务
screening_enabled = true
screening_dir = "screenings"
screening_page_size = 60
screening_default_mode = "line"
screening_auto_interval = 2.5
screening_auto_pause_on_catgirl = true
screening_review_word_limit = 300
screening_review_title_format = "{date} · 放映厅观后感"
# 拾光 · 对话目录悬浮窗：默认关闭；开启并保存后立即打开，之后也可用 #拾光 打开
catalog_enabled = false
catalog_command = "#拾光"
catalog_send_respond = false
catalog_search_limit = 40
catalog_width = 420
catalog_height = 560
catalog_ball_size = 64
catalog_always_on_top = true
catalog_max_scan_days = 365
catalog_idle_close_minutes = 10
catalog_history_limit = 20
catalog_restore_last_search = true
# 送入对话时的模板文案；留空 = 不要这一段（引用模板只有结尾，话题模板有开头和结尾）
catalog_quote_footer = "（这是从拾光对话目录里翻出来的，想和你一起看看。）"
catalog_topic_lead = "我翻到这一段，想和你聊聊："
catalog_topic_footer = "（不用马上接话，看到就好。）"
# 时间胶囊到期提醒：每天指定时刻后检查一次，只递给猫娘，不显示在聊天里
capsule_notify_enabled = true
capsule_notify_hour = 9

# 章节编排：两句话间隔超过这个分钟数就另起一个场景；0 表示整天不切分
scene_gap_minutes = 30
chapter_title_format = "第 {index} 章 · {date}"
include_system = false
max_turn_chars = 4000

# 日记：auto/llm = 用模型写；模型不可用时日记留空（不自动降级）；local = 只用本地摘要
diary_engine = "auto"
diary_style = "first_person"
diary_language = "zh-CN"
diary_title_format = "{date} · 日记"
keyword_top_n = 8
highlight_top_n = 5
# 日记正文来源：memor = 以备忘录为主、对话为辅（默认）；transcript = 只用原始对话
diary_source = "memor"
# 备忘录抓取策略：tail = 末段锚点定位（只追新增段，默认）；line = 逐行去重；append = 整段追加
memo_append_mode = "tail"
# 日记正文字数上限（本地第一人称日记按此截断）
diary_word_limit = 400
llm_max_chars = 24000
llm_timeout_seconds = 60.0
# 模型请求失败后的重试次数上限（含第一次尝试），默认 3 次
llm_retry_attempts = 3
llm_temperature = 0.4

# 模型端点/密钥统一在浏览页「模型配置」按钮里维护；不配置时自动复用宿主模型槽位。

# 每日备忘录：抓宿主 recent.json 的 system 备忘录，只追加新增段；
# 章节标题默认从备忘录取随机一条（可手动覆盖）。
memo_enabled = true
auto_title_from_memo = true

# 检索默认参数（猫娘调取「我说过…吗」）——缺省时使用，可在配置里自由调整
search_default_days = 365        # 往回查几天（默认扫一年，保证「我说过…吗」能命中）
search_default_limit = 8         # 最多返回几条
search_snippet_limit = 120       # 命中片段长度
search_include_diary = true      # 是否同时检索章节/日记
search_trigger_words = "我说过,我提过,是不是说过,之前说过"   # 提示词里的触发语（供模型参考，中文/英文逗号分隔）

# 猫娘日记（任务3）：猫娘自己写的日记，单独存放、仅增加不覆盖，绝不修改自动日记
cat_diary_enabled = true
cat_diary_dir = "neko_diary"
cat_diary_word_limit = 500
cat_diary_default_visibility = "public"   # 默认可见性：public=公开，private=仅自己可见（猫娘自己仍读得到）
cat_diary_default_mood = "neutral"        # 默认心情：excited/happy/calm/tired/anxious/sad/angry/neutral
# 猫娘标了「仅自己可见」的私密日记是否显示在浏览页/面板（她自己的读写始终不受影响）
cat_diary_private_readable = true

# 浏览页「点内容可复制序号」的短语片段：{prefix} {date} {mid} {index} {index_unit} {suffix}
# 默认 → "把 2026-10-07 的第 13 条念给我听"；四个片段都可自定义
copy_phrase_prefix = "把"
copy_phrase_mid = "的第"
copy_phrase_index_unit = "条"
copy_phrase_suffix = "念给我听"

# 采集
capture_all_sources = false
poll_memory_limit = 50
poll_conversation_limit = 200
# 宿主自己的对话存储 <用户数据根>\memory\<角色>\（time_indexed.db / recent.json）——
# 实测只有这里能同时读到用户与角色双方的对话，默认打开
read_host_memory_store = true
memory_store_limit = 200
memory_store_character = ""
live_refresh_seconds = 300
compile_on_startup = true
startup_backfill_days = 3
finalize_enabled = true
# 每日日记不再向聊天发送提示；需要查看时发送「爱妻日记」+日期

# 写进章节/日记的称呼
master_name = "主人"
catgirl_name = "猫娘"

# 需要脱敏的字符串：出现在对话里时会被替换成 ＊＊＊
redact = []
